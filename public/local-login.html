<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dialeaze - Local Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f7fb;
            font-family: Arial, sans-serif;
        }

        .login-box {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 15px 45px rgba(0,0,0,0.10);
        }

        .logo {
            text-align: center;
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 8px;
            color: #111827;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #374151;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 18px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #111827;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #111827;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.92;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #message {
            margin-top: 18px;
            text-align: center;
            font-size: 14px;
        }

        .error {
            color: #dc2626;
        }

        .success {
            color: #16a34a;
        }
    </style>
</head>

<body>

<div class="login-box">

    <div class="logo">Dialeaze</div>

    <div class="subtitle">
        Local Dialer Login
    </div>

    <form id="loginForm">

        <label for="email">Email</label>

        <input
            type="email"
            id="email"
            required
            autocomplete="email"
            placeholder="Your email"
        >

        <label for="password">Password</label>

        <input
            type="password"
            id="password"
            required
            autocomplete="current-password"
            placeholder="Your password"
        >

        <button type="submit" id="loginButton">
            Sign In
        </button>

    </form>

    <div id="message"></div>

</div>

<script type="module">

    import { createClient }
        from "https://esm.sh/@supabase/supabase-js@2";


    // =====================================================
    // SUPABASE
    // =====================================================

    const SUPABASE_URL =
        "https://bgvzfkocbvcstowswixh.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
        "sb_publishable_45kBWskrAeltQsVHAtyWmQ__npKIYvd";


    const supabase = createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


    // =====================================================
    // ELEMENTS
    // =====================================================

    const form =
        document.getElementById("loginForm");

    const button =
        document.getElementById("loginButton");

    const message =
        document.getElementById("message");


    // =====================================================
    // LOGIN
    // =====================================================

    form.addEventListener("submit", async (event) => {

        event.preventDefault();

        const email =
            document.getElementById("email").value.trim();

        const password =
            document.getElementById("password").value;


        button.disabled = true;

        button.textContent = "Signing in...";

        message.textContent = "";

        message.className = "";


        try {

            // -------------------------------------------------
            // Sign in with Supabase
            // -------------------------------------------------

            const {
                data,
                error
            } = await supabase.auth.signInWithPassword({
                email: email,
                password: password
            });


            if (error) {
                throw new Error(
                    error.message || "Login failed."
                );
            }


            if (
                !data ||
                !data.session ||
                !data.session.access_token
            ) {
                throw new Error(
                    "Supabase did not return a valid login session."
                );
            }


            // -------------------------------------------------
            // Save the same tokens used by the dashboard
            // -------------------------------------------------

            localStorage.setItem(
                "dialeaze_access_token",
                data.session.access_token
            );

            localStorage.setItem(
                "dialeaze_refresh_token",
                data.session.refresh_token || ""
            );

            localStorage.setItem(
                "dialeaze_user",
                JSON.stringify(data.user)
            );


            // -------------------------------------------------
            // IMPORTANT
            // The Supabase JS client now has a real session.
            // This is what app.js was missing.
            // -------------------------------------------------

            const {
                data: sessionData,
                error: sessionError
            } = await supabase.auth.getSession();


            if (
                sessionError ||
                !sessionData ||
                !sessionData.session
            ) {
                throw new Error(
                    "Login succeeded, but the local Supabase session could not be established."
                );
            }


            // -------------------------------------------------
            // Success
            // -------------------------------------------------

            message.textContent =
                "Login successful! Opening dialer...";

            message.className = "success";


            setTimeout(() => {

                window.location.href = "/";

            }, 700);


        } catch (error) {

            console.error(
                "Local login error:",
                error
            );

            message.textContent =
                error.message || "Login failed.";

            message.className = "error";

            button.disabled = false;

            button.textContent = "Sign In";
        }

    });

</script>

</body>
</html>
